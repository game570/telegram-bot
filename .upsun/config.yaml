applications:
  bot:
    type: python:3.11
    dependencies:
      python:
        3.11: {}
    # Definicja workerów/usługi w tle
    runtime:
      extensions:
        - pdo
    # Skrypt startowy i instalacja zależności
    web:
      commands:
        start: "python main.py"
    hooks:
      build: |
        set -ex
        pip install -r requirements.txt
